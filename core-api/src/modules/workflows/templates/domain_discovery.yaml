name: domain_discovery

on:
  target: [domain.create, domain.re-scan]

# Jobs are keyed by a unique id and `needs` lists the ids that must finish
# first (like GitHub Actions). A job without `needs` is a root and starts in
# parallel with the other roots, so the recon chain below is explicit.
jobs:
  scan_subdomain:
    name: Scan Subdomain
    run: subfinder

  port_scan:
    name: Port Scan
    run: naabu
    needs: [scan_subdomain]

  http_probe:
    name: HTTP Probe
    run: httpx
    needs: [port_scan]

  take_screenshot:
    name: Take Screenshot
    run: screenshot
    needs: [http_probe]
