syntax = "proto3";

package workers;

import "google/protobuf/timestamp.proto";

option go_package = "./workers";

message JoinRequest {
  string          api_key   = 1;
  string          signature = 2;
  optional string token     = 3;
  optional WorkerMetadata metadata = 4;
}

enum WorkerRunMode {
  WORKER_RUN_MODE_UNKNOWN = 0;
  WORKER_RUN_MODE_CLI = 1;
  WORKER_RUN_MODE_NODE = 2;
}

message WorkerMetadata {
  optional string name = 1;
  optional string os = 2;
  optional WorkerRunMode mode = 3;
}

message JoinResponse {
  string worker_id    = 1;
  string worker_token = 2;
}

message AliveRequest {
  string worker_token = 1;
}

message AliveResponse {
  bool   alive        = 1;
  string last_seen_at = 2;
  string worker_id    = 3;
}

message GetManifestRequest {}

message GetManifestResponse {
  repeated string init_commands = 1;
}

message StorageRequest {
  string path = 1;
}

message StorageResponse {
  bytes chunk  = 1;
  int32 offset = 2;
  bool  eof    = 3;
}

message NetworkInterfaceMessage {
  string interface_name = 1;
  string ip_address     = 2;
  string cidr           = 3;
  string gateway_ip     = 4;
  string gateway_mac    = 5;
}

message ConnectInternalNetworkRequest {
  string worker_id           = 1;
  string network_id          = 2;
  repeated NetworkInterfaceMessage network_interfaces = 3;
}

message ConnectInternalNetworkResponse {
  string message = 1;
}

message BuiltinToolRegistryRequest {
  string os = 1;    // worker sends: runtime.GOOS (e.g., "linux")
  string arch = 2;  // worker sends: runtime.GOARCH (e.g., "arm64")
}

message BuiltinToolRegistryResponse {
  repeated string tool_paths = 1;
}

message RemoteExecuteSubscribeRequest {}

enum RemoteExecuteSubscribeEventType {
  REMOTE_EXECUTE_SUBSCRIBE_EVENT_UNKNOWN   = 0;
  REMOTE_EXECUTE_SUBSCRIBE_EVENT_CONNECTED = 1;
  REMOTE_EXECUTE_SUBSCRIBE_EVENT_COMMAND   = 2;
}

message RemoteExecuteSubscribeResponse {
  string id                               = 1;
  string worker_id                        = 2;
  RemoteExecuteSubscribeEventType type    = 3;
  string session_id                       = 4;
  string command                          = 5;
}

message RemoteExecuteResultStream {
  string id                            = 1;
  string session_id                    = 2;
  RemoteExecuteResultEventType type    = 3;
  bytes  data                          = 4;
  int32  exit_code                     = 5;
}

enum RemoteExecuteResultEventType {
  REMOTE_EXECUTE_RESULT_UNKNOWN = 0;
  REMOTE_EXECUTE_RESULT_STDOUT  = 1;
  REMOTE_EXECUTE_RESULT_STDERR  = 2;
  REMOTE_EXECUTE_RESULT_EXIT    = 3;
  REMOTE_EXECUTE_RESULT_ERROR   = 4;
}

message RemoteExecuteResultAck {
  bool   success = 1;
  string message = 2;
}

enum WorkerRuntimeState {
  WORKER_RUNTIME_STATE_UNSPECIFIED = 0;
  WORKER_RUNTIME_STATE_READY = 1;
  WORKER_RUNTIME_STATE_DRAINING = 2;
  WORKER_RUNTIME_STATE_DEGRADED = 3;
}

enum ContainerRuntimeState {
  CONTAINER_RUNTIME_STATE_UNSPECIFIED = 0;
  CONTAINER_RUNTIME_STATE_PROVISIONING = 1;
  CONTAINER_RUNTIME_STATE_RUNNING = 2;
  CONTAINER_RUNTIME_STATE_EXITED = 3;
  CONTAINER_RUNTIME_STATE_REMOVING = 4;
  CONTAINER_RUNTIME_STATE_UNKNOWN = 5;
}

enum ContainerHealthState {
  CONTAINER_HEALTH_STATE_UNKNOWN = 0;
  CONTAINER_HEALTH_STATE_NONE = 1;
  CONTAINER_HEALTH_STATE_STARTING = 2;
  CONTAINER_HEALTH_STATE_HEALTHY = 3;
  CONTAINER_HEALTH_STATE_UNHEALTHY = 4;
}

enum ContainerExecutionState {
  CONTAINER_EXECUTION_STATE_NONE = 0;
  CONTAINER_EXECUTION_STATE_ACTIVE = 1;
  CONTAINER_EXECUTION_STATE_COMPLETED = 2;
  CONTAINER_EXECUTION_STATE_CANCELLED = 3;
  CONTAINER_EXECUTION_STATE_FAILED = 4;
}

message WorkerNodeTelemetry {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string run_mode = 4;
  uint32 cpu_count = 5;
  double cpu_usage_percent = 6;
  uint64 memory_used_bytes = 7;
  uint64 memory_total_bytes = 8;
  reserved 9, 10;
}

message WorkerJobTelemetry {
  uint32 active = 1;
  uint32 max_concurrency = 2;
}

message ManagedContainerTelemetry {
  string container_id = 1;
  string container_name = 2;
  string image = 3;
  string image_version = 4;
  string tool = 5;
  string pool_key = 6;
  bool pooled = 7;
  ContainerRuntimeState runtime_state = 8;
  ContainerHealthState health_state = 9;
  ContainerExecutionState execution_state = 10;
  bool connector_connected = 11;
  optional int32 exit_code = 12;
  bool oom_killed = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp started_at = 15;
  optional google.protobuf.Timestamp finished_at = 16;
  google.protobuf.Timestamp state_changed_at = 17;
  google.protobuf.Timestamp last_used_at = 18;
  optional string execution_id = 19;
  optional string job_id = 20;
  optional string trace_id = 21;
  double cpu_limit_millicores = 22;
  uint64 memory_limit_bytes = 23;
  bool inspection_succeeded = 24;
}

message WorkerContainersTelemetry {
  bool supported = 1;
  uint32 total = 2;
  uint32 active = 3;
  uint32 idle = 4;
  uint32 unhealthy = 5;
  bool truncated = 6;
  repeated ManagedContainerTelemetry items = 7;
}

message WorkerTelemetryRequest {
  uint32 schema_version = 1;
  string instance_id = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp started_at = 5;
  uint64 uptime_seconds = 6;
  WorkerRuntimeState state = 7;
  string version = 8;
  WorkerNodeTelemetry node = 9;
  WorkerJobTelemetry jobs = 10;
  WorkerContainersTelemetry containers = 11;
}

message WorkerTelemetryResponse {
  uint64 accepted_sequence = 1;
  google.protobuf.Timestamp received_at = 2;
  string worker_id = 3;
  uint32 next_report_after_ms = 4;
}

// --- bidirectional worker stream (Connect) ---
// The worker opens one long-lived stream on Connect. It carries the register
// handshake and heartbeats up, and register responses, heartbeats acks and job
// cancellations down. Identity, job pull and results deliberately keep their
// own RPCs; this stream only adds the push channel core-api lacked.

message WorkerToCore {
  oneof payload {
    RegisterRequest register  = 1;
    Heartbeat       heartbeat = 2;
  }
}

message CoreToWorker {
  oneof payload {
    RegisterResponse register_resp  = 1;
    HeartbeatAck     heartbeat_ack  = 2;
    CancelRequest    cancel         = 3;
  }
}

// Register is the first frame on every connect. It carries the same identity
// material as Join: an API key (+ optional signature) for a first-ever connect,
// or a persisted worker token to rejoin the same identity.
message RegisterRequest {
  string api_key = 1;
  string signature = 2;
  optional string token = 3;
  optional WorkerMetadata metadata = 4;
  optional string version = 5;
}

message RegisterResponse {
  string worker_id = 1;
  string worker_token = 2;
  bool   accepted = 3;
  string reason = 4;
  // Server-driven liveness cadence. 0 means "use the client default".
  uint32 heartbeat_interval_ms = 5;
}

message Heartbeat {
  string worker_id = 1;
  uint64 sequence = 2;
  int64 at_ms = 3;
}

message HeartbeatAck {
  string worker_id = 1;
  int64 server_time_ms = 2;
}

// Cancel stops a running execution. It is keyed by job_id — not execution_id —
// because that is the only correlation core-api owns (the Job entity has no
// execution column); the worker resolves job_id -> execution id itself.
message CancelRequest {
  string job_id = 1;
  string reason = 2;
  optional string cancelled_by = 3;
}

service WorkersService {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Alive(AliveRequest) returns (stream AliveResponse);
  rpc WorkerTelemetry(WorkerTelemetryRequest) returns (WorkerTelemetryResponse);
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
  rpc Storage(StorageRequest) returns (stream StorageResponse);
  rpc ConnectInternalNetwork(ConnectInternalNetworkRequest) returns (ConnectInternalNetworkResponse);
  rpc BuiltinToolRegistry(BuiltinToolRegistryRequest) returns (BuiltinToolRegistryResponse);
  rpc RemoteExecuteSubscribe(RemoteExecuteSubscribeRequest) returns (stream RemoteExecuteSubscribeResponse);
  rpc RemoteExecuteResult(RemoteExecuteResultStream) returns (RemoteExecuteResultAck);
  // Long-lived bidirectional channel: the push half is what lets core-api stop a
  // running job instead of only flipping its status in the database.
  rpc Connect(stream WorkerToCore) returns (stream CoreToWorker);
}
