name: Check Test

on:
  push:
    branches:
      - '**'
    paths:
      - 'core-api/**'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig*.json'
  # No `paths:` here: "Check Test" is a required check on main, and a
  # workflow-level filter leaves it "Expected" forever on PRs that don't touch
  # these paths (worker, Actions, Docker bumps), blocking merge and auto-merge.
  # The filter runs inside the job instead so the check always reports.
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  # dorny/paths-filter lists PR files through the REST API.
  pull-requests: read

jobs:
  test:
    name: Check Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'core-api/**'
              - 'package*.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'tsconfig*.json'
              - '.nvmrc'
              - '.github/workflows/check-test.yml'

      - name: Setup pnpm
        if: steps.filter.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run tests
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm run test
        working-directory: core-api
