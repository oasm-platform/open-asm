name: Check Test

on:
  push:
    branches:
      - '**'
    paths:
      - 'core-api/**'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig*.json'
  pull_request:
    branches:
      - '**'
    paths:
      - 'core-api/**'
      - 'package*.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig*.json'

jobs:
  test:
    name: Check Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Run tests
        run: pnpm run test
        working-directory: core-api
