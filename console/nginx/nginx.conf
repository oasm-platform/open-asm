# Main nginx configuration for the console image.
#
# Instantiated from the stock `nginx:stable-alpine` /etc/nginx/nginx.conf so the
# bundled pieces (mime.types lookup, the conf.d include) keep working, with the
# additions needed for direct object reads from the private RustFS bucket:
#   - load the bundled njs dynamic module (no `apk add`, no modules/*.conf glob)
#   - preserve the storage-signing environment variables for njs
#   - declare the js_import / js_set variables the /files/ location consumes
#
# Dropping `include mime.types;` or `default_type` would serve the SPA's .js as
# application/octet-stream and break the console, so both are retained verbatim.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# njs is bundled in the image at this exact path. Load it explicitly: the stock
# config has no `include /etc/nginx/modules/*.conf;`, and that directory holds
# only .so files, so a glob would load nothing.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

# Values injected by compose at runtime. `env` is a main-context directive; njs
# reads them through process.env. Never bake credentials into the image.
env RUSTFS_ACCESS_KEY;
env RUSTFS_SECRET_KEY;
env S3_REGION;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    js_import s3auth from /etc/nginx/njs/s3auth.js;

    # One timestamp per request, shared by $awsDate and $s3auth so the signed
    # date cannot straddle a second boundary between the two evaluations.
    js_var $s3_request_time '';
    js_set $awsDate s3auth.awsDate;
    js_set $awsPayloadHash s3auth.awsPayloadHash;
    js_set $s3auth s3auth.s3auth;
    js_set $files_bucket s3auth.filesBucket;
    js_set $files_key s3auth.filesKey;

    # Cache-Control by bucket for /files/. `map` is http-context only, so it must
    # live here rather than in conf.d/default.conf's server block. system objects
    # are public; tenant buckets stay browser-private with no shared cache.
    map $files_bucket $files_cache_control {
        default 'private, no-cache';
        system  'public, max-age=1209600, no-transform';
    }

    include /etc/nginx/conf.d/*.conf;
}
