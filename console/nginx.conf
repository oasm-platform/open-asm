upstream core_api {
		server core-api:6276;
}

# Presigned S3 object keys arrive at the console origin, so the request has to be
# handed to the storage backend instead of the SPA. nginx cannot build a variable
# name containing hyphens ($arg_X-Amz-Signature parses as $arg_X + literal text and
# is always truthy), so match the query string instead.
map $args $is_presigned {
		default 0;
		~(^|&)X-Amz-Signature= 1;
}

upstream object_storage {
		server rustfs:9000;
}

server {
		listen 80;
		listen [::]:80;

		root /usr/share/nginx/html;
		index index.html;

		location / {
				# Guard here too: a presigned key is served by storage, never by the SPA fallback.
				if ($is_presigned) { return 418; }
				try_files $uri /index.html;
		}

		# 418 (instead of a direct proxy in each location) keeps one proxy definition
		# and still runs from the rewrite phase, so it wins over try_files.
		error_page 404 /index.html;
		error_page 418 = @object_storage;

		# Optional: Add cache control for better performance
		# Note: Removed png, svg from static files to ensure API requests are forwarded properly
		location ~* \.(?:ico|css|js|gif|jpe?g|woff2?|eot|ttf|webp)$ {
				# Without this guard a presigned key ending in .webp/.jpg/.gif would be
				# answered from this location (404 -> index.html) instead of the storage backend.
				if ($is_presigned) { return 418; }
				expires 6M;
				access_log off;
				add_header Cache-Control "public";
		}

		# Direct object reads: browser -> nginx (auth_request -> core) -> RustFS.
		# Bucket/key are derived by the njs wrapper (`js_set $files_bucket`/`$files_key`,
		# defined in the main nginx.conf) from `$request_uri` — NOT `$uri`: an
		# auth_request subrequest has its own `$uri` (`/_files_auth`), so `$uri` here
		# would yield garbage and deny every read.
		# `^~` makes this prefix beat the static-asset regex above, so a stored
		# `.webp`/`.jpg` object is proxied to storage instead of being answered by the
		# SPA (404 -> index.html) or the static location.
		# Upstream reads are signed with njs SigV4 (Authorization + x-amz-date +
		# x-amz-content-sha256) for exactly `Host rustfs:9000`, keeping the bucket
		# fully private. No `proxy_cache` here: tenant objects must never be shared.
		location = /_files_auth {
				internal;
				proxy_pass http://core_api/api/storage/authz;
				proxy_pass_request_body off;
				proxy_set_header Content-Length "";
				# Values come from `$request_uri`, so they stay correct inside the subrequest.
				proxy_set_header X-Files-Bucket $files_bucket;
				proxy_set_header X-Files-Key $files_key;
				proxy_set_header Cookie $http_cookie;
				proxy_set_header Host $host;
		}

		location ^~ /files/ {
				# Both guards are 403 and order matters: empty bucket first, then the
				# allow-list. There is deliberately no separate empty -> 404 branch.
				if ($files_bucket = '') { return 403; }
				if ($files_bucket !~ ^(screenshot|cached-static|system)$) { return 403; }

				auth_request /_files_auth;

				add_header Cache-Control $files_cache_control always;

				# A missing object is a real 404, never the server-level SPA fallback.
				error_page 404 =404;

				# Host is signed for exactly this value; the upstream block name
				# (`object_storage`) would break the signature.
				proxy_pass http://object_storage/$files_bucket/$files_key;
				proxy_pass_request_headers off;
				# These conditional/range headers are NOT part of the signature and are
				# stripped by `proxy_pass_request_headers off`, but 304/partials need
				# them, so re-add them explicitly.
				proxy_set_header If-None-Match $http_if_none_match;
				proxy_set_header If-Modified-Since $http_if_modified_since;
				proxy_set_header Range $http_range;
				proxy_set_header Host rustfs:9000;
				proxy_set_header x-amz-date $awsDate;
				proxy_set_header x-amz-content-sha256 $awsPayloadHash;
				proxy_set_header Authorization $s3auth;
				proxy_http_version 1.1;
				proxy_set_header Connection "";
		}

		# Presigned object pass-through. The path must NOT be rewritten: SigV4 signs the
		# path too. Host is forwarded as $http_host (not $host) so the port is kept —
		# the signature covers host:port and $host would yield SignatureDoesNotMatch.
		# No CORS headers here: this route is same-origin, bucket CORS covers direct hits.
		location @object_storage {
				proxy_pass http://object_storage;
				proxy_set_header Host $http_host;
				proxy_http_version 1.1;
				proxy_set_header Connection "";
				client_max_body_size 100m;
				proxy_request_buffering off;
				proxy_buffering off;
				proxy_connect_timeout 300;
				proxy_read_timeout 300;
		}

		# LLM agent message streaming — extended timeout for inference latency
		location /api/agents/messages/stream {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
				proxy_read_timeout 600s;
				proxy_send_timeout 600s;
				proxy_buffering off;
				proxy_cache off;
		}

		# SSE notifications stream — long-lived connection, no buffering
		location /api/notifications/stream {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
				proxy_set_header Connection "";
				proxy_http_version 1.1;
				proxy_read_timeout 3600s;
				proxy_buffering off;
				proxy_cache off;
		}

		# API location block - must come after static files to ensure proper precedence
		# but we need to handle API requests that might have file extensions
		location /api/ {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}
}