upstream core_api {
		server core-api:6276;
}

# Presigned S3 object keys arrive at the console origin, so the request has to be
# handed to the storage backend instead of the SPA. nginx cannot build a variable
# name containing hyphens ($arg_X-Amz-Signature parses as $arg_X + literal text and
# is always truthy), so match the query string instead.
map $args $is_presigned {
		default 0;
		~(^|&)X-Amz-Signature= 1;
}

upstream object_storage {
		server rustfs:9000;
}

server {
		listen 80;
		listen [::]:80;

		root /usr/share/nginx/html;
		index index.html;

		location / {
				# Guard here too: a presigned key is served by storage, never by the SPA fallback.
				if ($is_presigned) { return 418; }
				try_files $uri /index.html;
		}

		# 418 (instead of a direct proxy in each location) keeps one proxy definition
		# and still runs from the rewrite phase, so it wins over try_files.
		error_page 404 /index.html;
		error_page 418 = @object_storage;

		# Public prefixes (unsigned): buckets `system` + `cached-static` are Get-only
	# public, so plain GETs proxy straight to storage with no signature. Host is
	# $http_host (not $host) to match the @object_storage convention. `^~` beats
	# the static-asset extension regex below so /system/*.webp lands here. The
	# presigned guard keeps signed URLs on the server-level 418 mapping; without
	# it a signed fetch would be answered here AND marked public. NO error_page
	# in here: a location-level error_page shadows the server-level
	# `error_page 418 = @object_storage` and breaks presigned fallback with a
	# bare 418. No proxy_intercept_errors, so a missing key returns rustfs 404.
	# add_header without `always` applies to 2xx/3xx only, so errors are never
	# marked public.
	location ^~ /system/ {
			limit_except GET { deny all; }
			if ($is_presigned) { return 418; }
			proxy_pass http://object_storage;
			proxy_set_header Host $http_host;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			add_header Cache-Control "public, max-age=2592000";
	}

	location ^~ /cached-static/ {
			limit_except GET { deny all; }
			if ($is_presigned) { return 418; }
			proxy_pass http://object_storage;
			proxy_set_header Host $http_host;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			add_header Cache-Control "public, max-age=2592000";
	}

	# Optional: Add cache control for better performance
		# Note: Removed png, svg from static files to ensure API requests are forwarded properly
		location ~* \.(?:ico|css|js|gif|jpe?g|woff2?|eot|ttf|webp)$ {
				# Without this guard a presigned key ending in .webp/.jpg/.gif would be
				# answered from this location (404 -> index.html) instead of the storage backend.
				if ($is_presigned) { return 418; }
				expires 6M;
				access_log off;
				add_header Cache-Control "public";
		}

		# Presigned object pass-through. The path must NOT be rewritten: SigV4 signs the
		# path too. Host is forwarded as $http_host (not $host) so the port is kept —
		# the signature covers host:port and $host would yield SignatureDoesNotMatch.
		# No CORS headers here: this route is same-origin, bucket CORS covers direct hits.
		location @object_storage {
				proxy_pass http://object_storage;
				proxy_set_header Host $http_host;
				proxy_http_version 1.1;
				proxy_set_header Connection "";
				client_max_body_size 100m;
				proxy_request_buffering off;
				proxy_buffering off;
				proxy_connect_timeout 300;
				proxy_read_timeout 300;
		}

		# LLM agent message streaming — extended timeout for inference latency
		location /api/agents/messages/stream {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
				proxy_read_timeout 600s;
				proxy_send_timeout 600s;
				proxy_buffering off;
				proxy_cache off;
		}

		# SSE notifications stream — long-lived connection, no buffering
		location /api/notifications/stream {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
				proxy_set_header Connection "";
				proxy_http_version 1.1;
				proxy_read_timeout 3600s;
				proxy_buffering off;
				proxy_cache off;
		}

		# API location block - must come after static files to ensure proper precedence
		# but we need to handle API requests that might have file extensions
		location ^~ /api/storage/ {
				proxy_pass http://object_storage/;
				proxy_set_header Host rustfs:9000;
				proxy_http_version 1.1;
				proxy_set_header Connection "";
				client_max_body_size 100m;
				proxy_request_buffering off;
		}

		location = /api/storage/presign/upload {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}

		location = /api/storage/presign/download {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}

		location = /api/storage/logo/presign {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}

		location = /api/storage/logo/confirm {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/ {
				proxy_pass http://core_api;
				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;
		}
}