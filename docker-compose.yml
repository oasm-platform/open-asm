services:
  console:
    container_name: console
    image: oasm/oasm-console:latest
    build:
      context: .
      dockerfile: console/Dockerfile
    networks:
      - oasm
    env_file:
      - ./console/.env
    environment:
      # njs SigV4 signing creds (runtime only, never baked into the image).
      # Interpolated from the compose --env-file (core-api/.env); safe defaults
      # so empty env cannot produce empty creds. Canonical S3_* wins, legacy
      # RUSTFS_* kept as a one-release deprecated alias.
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-rustfsadmin}}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY:-rustfssecret}}
      - S3_REGION=${S3_REGION:-us-east-1}
    ports:
      - '3000:80'
    restart: 'always'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

    depends_on:
      core-api:
        condition: service_healthy
      # nginx resolves `upstream object_storage { server rustfs:9000; }` when it
      # loads its config, so rustfs must exist before the console starts —
      # otherwise nginx aborts with "host not found in upstream".
      rustfs:
        condition: service_started

  core-api:
    container_name: oasm-api
    image: oasm/oasm-api:latest
    build:
      context: .
      dockerfile: core-api/Dockerfile
    networks:
      - oasm
    env_file:
      - ./core-api/.env
    ports:
      - '6276:6276'
      - '16276:16276'
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://:password@redis:6379/0
      - GEO_IP_URL=geo-ip:4360
      - OASM_CLOUD_APIKEY=change_me
      - RUSTFS_ENDPOINT=http://rustfs:9000
      # Presign host MUST match the origin the browser actually requests.
      # console/nginx.conf routes on the QUERY STRING, not on a path: `map $args
      # $is_presigned` flags any request carrying X-Amz-Signature, and those
      # locations `return 418`, which `error_page 418 = @object_storage` hands to
      # rustfs with `Host $http_host` preserved so SigV4 validates. Every other
      # request is served by the SPA. Never point this at rustfs:9000, and never
      # introduce a path prefix (e.g. /s3/) to separate storage traffic — SigV4
      # signs the path too, so a rewrite yields SignatureDoesNotMatch.
      - S3_PUBLIC_ENDPOINT=http://localhost:3000
      # Origins allowed to PUT/GET with the presigned headers: the compose
      # console origin plus the vite dev server on :5173. Canonical CORS list;
      # the API reads CORS_ALLOWED_ORIGINS (S3_CORS_* alias is deprecated).
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    restart: 'always'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    volumes:
      - ./.open-api:/.open-api
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6276/api/health']
      interval: 1s
      timeout: 30s
      retries: 10

  oasm-worker:
    image: oasm/oasm-worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - ./worker/.env
    environment:
      - WORKER_API_KEY=change_me
      - WORKER_MODE=node
      - WORKER_GRPC_HOST=core-api
      - WORKER_GRPC_PORT=16276
      # Concurrency auto-sizes from the container's CPU/RAM (cgroup-aware).
      # Pin it by setting WORKER_MAX_CONCURRENCY to a positive value.
      - WORKER_TOOL_PATH=/app/oasm-tools
      # Persist the join token on the worker-state volume: without it every
      # container recreation mints a fresh identity and startup orphan
      # reconcile can no longer recognize the previous run's containers.
      - WORKER_TOKEN_FILE=/app/state/.worker-token
      # WORKER_CONNECTOR_ADDR: optional override for the address connector
      # containers dial back on (auto-derived when unset — host.docker.internal
      # on any OS via a host-gateway ExtraHosts mapping the worker adds on
      # Linux; IPv4 bridge gateway fallback on engines < Docker Engine 20.10).
      - WORKER_CONNECTOR_ADDR=host.docker.internal:26276
      # Firewall: the connector port (26276) must accept inbound from spawned
      # containers (docker bridge, or the compose network when pinned above).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - worker-tools-cache:/app/oasm-tools:rw
      - worker-state:/app/state
      # The worker spawns connector containers via the Docker Engine API
      # (internal/runtime/docker.go), so it MUST reach a daemon. Mount the host
      # socket (docker-outside-of-docker). SECURITY: docker.sock is
      # root-equivalent on the host — only run trusted images with this worker.
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as non-root uid/gid 1000, but the mounted socket is owned
    # by root:docker (mode 0660) on native Linux engines. Without the socket's
    # group in the worker's supplementary groups the daemon answers "permission
    # denied" and API version negotiation silently falls back to 1.24.
    #
    # The socket group's gid is host-specific: 0 on Docker Desktop (root:root)
    # and the host's `docker` group gid on native Linux (commonly 999/986/968 —
    # check with `stat -c '%g' /var/run/docker.sock`, or `stat -f '%g'` on
    # macOS). `task docker-compose` detects it automatically; for a raw
    # `docker compose up` set it explicitly, e.g.
    #   WORKER_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d
    group_add:
      - "${WORKER_DOCKER_GID:-0}"
    ports:
      # Connector gRPC listen port. Spawned connector containers run on the host
      # daemon (default bridge), so they must dial back through the host via
      # WORKER_CONNECTOR_ADDR=host.docker.internal:26276 — which requires this
      # port published on the host.
      - '26276:26276'
    networks:
      - oasm
    restart: 'always'
    depends_on:
      core-api:
        condition: service_healthy

  postgres:
    container_name: oasm-postgres
    image: pgvector/pgvector:pg17
    restart: always
    env_file:
      - ./core-api/.env
    environment:
      POSTGRES_USER: '${POSTGRES_USERNAME:-postgres}'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-open_asm}
      POSTGRES_HOST_AUTH_METHOD: trust
      PGUSER: '${POSTGRES_USERNAME:-postgres}'
      PGPASSWORD: '${POSTGRES_PASSWORD:-postgres}'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - oasm
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    container_name: oasm-redis
    image: redis:alpine
    restart: always
    ports:
      - '6379:6379'
    networks:
      - oasm
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - redis-data:/data
    command: 'redis-server --requirepass password'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1500M
        reservations:
          cpus: '0.5'
          memory: 512M

  geo-ip:
    container_name: geo-ip
    image: ghcr.io/l1ttps/geoip-proxy:latest
    networks:
      - oasm
    ports:
      - '4360:4360'
    restart: 'always'
    volumes:
      - geoip-data:/app/data:rw

  rustfs:
    container_name: oasm-rustfs
    image: rustfs/rustfs:latest
    networks:
      - oasm
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      # Canonical S3_* wins, legacy RUSTFS_* kept as a one-release
      # deprecated alias; safe defaults so empty env cannot produce empty creds.
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-rustfsadmin}}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY:-rustfssecret}}
    volumes:
      - rustfs-data:/data:rw
    restart: 'always'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: ['/data']

  migration:
    container_name: oasm-migration
    image: oasm/oasm-api:latest
    networks:
      - oasm
    env_file:
      - ./core-api/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-open_asm}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "cd /app && pnpm exec typeorm migration:run -d dist/database/database-config.js"

volumes:
  pgdata:
  redis-data:
  redpanda-data:
  geoip-data:
  rustfs-data:
  worker-tools-cache:
  worker-state:

networks:
  oasm:
    driver: bridge
